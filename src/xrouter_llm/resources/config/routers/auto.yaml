# A router config = a named candidate set (1 or N models) + policy knobs.
# Load a directory of these with: serve --routers-dir config/routers
# The "auto" config routes across benchmarked candidates, cheapest-that-completes.
name: auto
description: Route across benchmarked candidates; pick the cheapest predicted to complete.
completion_threshold: 0.7      # predicted completion-probability cutoff
lambda_cost: 1.0
max_k: 1                        # 1 = single model; >1 enables fusion candidate sets
fallback_quality_margin: 0.05  # if none clear the cutoff, take the cheapest model
                               # within this margin of the best completion, not
                               # the priciest highest-completion one
models:
  - anthropic/claude-opus-5
  - anthropic/claude-sonnet-5
  - deepseek/deepseek-v4.1-flash
  - google/gemini-3.1-pro-preview
  - google/gemini-3.1-flash-lite
  - minimax/minimax-m3
  - moonshotai/kimi-k2.7-code
  - z-ai/glm-4.7
  - z-ai/glm-5.2
  - z-ai/glm-5.3-flash
  - openai/gpt-5.6-luna
  - openai/gpt-5.6-terra
  - openai/gpt-5.6-sol
  - x-ai/grok-4.6
  # September additions with verified capability benchmarks. Metadata-only
  # profiles stay out until GPQA Diamond or LiveCodeBench results are available.
  - openai/gpt-6-astra
  - google/gemini-3.8-flash
  - z-ai/glm-5.3
  - qwen/qwen3.8-max-0902
  - qwen/qwen3.8-omni-flash
