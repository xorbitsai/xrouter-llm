# One model per file. Load the registry with: --benchmark-profiles config/models
# benchmarks are PUBLISHED PERCENTAGES (0-100). Pricing rechecked 2026-09-02.
# Scores are max-effort independent evaluations; verify your served reasoning effort.
model_id: openai/gpt-5.6-sol
provider: openai
input_modalities: [text, image, file]
aliases: ["gpt-5.6-sol", "gpt-5.6"]
release_date: "2026-07-09"
source_quality: dataset_aggregate
source_urls:
  - https://developers.openai.com/api/docs/models/gpt-5.6-sol
  - https://openrouter.ai/openai/gpt-5.6-sol
  - https://openrouter.ai/api/v1/models/openai/gpt-5.6-sol/endpoints
  - https://artificialanalysis.ai/evaluations/gpqa-diamond
  - https://www.vals.ai/models/openai_gpt-5.6-sol
context_length: 1050000
max_output_tokens: 128000
input_cost_per_1k: 0.002        # OpenRouter official OpenAI standard route: $2.00 / 1M
output_cost_per_1k: 0.010       # OpenRouter official OpenAI standard route: $10.00 / 1M
benchmarks:
  gpqa_diamond: 94.1            # Artificial Analysis, max effort
  livecodebench: 82.6           # Vals, 82.604
  hle: 49.5                     # Artificial Analysis
  mmlu_pro: 89.1                # Vals
  swe_bench_verified: 96.2      # Vals
  terminal_bench: 85.8          # Vals Terminal-Bench 2.1, 85.768
# Production should pin OpenRouter to the official OpenAI standard route
# (`openai`), not `openai/flex` or `openai/fast`. OpenAI list pricing is
# $4.00/$20.00 per 1M; OpenRouter currently applies a 50% discount. Above 272K
# input tokens the standard route lists $4.00/$15.00 per 1M, which the scalar
# profile schema cannot encode.
