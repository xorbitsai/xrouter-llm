# One model per file. Load the registry with: --benchmark-profiles config/models
# benchmarks are PUBLISHED PERCENTAGES (0-100). Served via OpenRouter. Researched 2026-08-15.
# Scores are max-effort independent evaluations; verify your served reasoning effort.
model_id: openai/gpt-5.6-luna
provider: openai
input_modalities: [text, image, file]
aliases: ["gpt-5.6-luna"]
release_date: "2026-07-09"
source_quality: dataset_aggregate
source_urls:
  - https://developers.openai.com/api/docs/models/gpt-5.6-luna
  - https://openrouter.ai/openai/gpt-5.6-luna
  - https://artificialanalysis.ai/evaluations/gpqa-diamond
  - https://www.vals.ai/models/openai_gpt-5.6-luna
context_length: 1050000
max_output_tokens: 128000
input_cost_per_1k: 0.0001       # OpenRouter current route: $0.10 / 1M
output_cost_per_1k: 0.0006      # OpenRouter current route: $0.60 / 1M
benchmarks:
  gpqa_diamond: 91.1            # Artificial Analysis, max effort
  hle: 39.5                     # Artificial Analysis
  mmlu_pro: 86.0                # Vals, 86.036
  swe_bench_verified: 93.0      # Vals
  terminal_bench: 79.0          # Vals Terminal-Bench 2.1, 79.026
# No independent LiveCodeBench score was available on 2026-08-15; capability
# therefore uses GPQA alone. OpenAI list price is $0.20/$1.20 per 1M; OpenRouter
# currently discounts it to $0.10/$0.60. Above 272K input tokens OpenRouter
# lists $0.20/$0.90, which the scalar profile schema cannot encode.
